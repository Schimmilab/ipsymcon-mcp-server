# Multi-instance config for the IP-Symcon MCP server.
#
# Point IPS_INSTANCES_FILE at a copy of this file. Keep the real file OUT of git —
# it holds credentials, exactly like .env. Without this file the server falls back to
# the single IPS_URL / IPS_USER / IPS_PASSWORD env vars (one implicit "default" instance),
# so existing single-instance setups keep working unchanged.
#
# Every tool then takes an optional `instance` parameter; omit it to use the default.
#
# ⚠️ chmod 600 the real file — it holds credentials in plain text.
# ⚠️ Prefer https:// URLs. Basic Auth over plain http:// exposes credentials and
#    every switching command to anyone on the same network.
#
# -- enable_write (optional, per instance) ----------------------------------
# BOTH gates must agree before anything is written: the process-wide
# IPS_ENABLE_WRITE *and* this per-instance flag.
#
#   enable_write: true   never grants writes on its own - the env var stays the
#                        master switch.
#   enable_write: false  TAKES writes away, even with the env var set.
#   omitted              inherits the env var (unchanged behaviour).
#
# That asymmetry is the point: you can open writes for a migration target while
# the production instance stays read-only. Before 2026-08-15 that was not
# possible - one boolean opened every instance at once, and a forgotten
# `instance` parameter falls back to the default.

default: home          # instance used when a tool call omits `instance`

instances:
  home:
    url: https://192.168.1.10:3777/api/
    user: ""           # IP-Symcon user (leave empty if the installation has no auth)
    password: ""
    enable_write: false  # the lived-in house: never written to, even with IPS_ENABLE_WRITE=true
  linux:               # e.g. a migration target
    url: https://192.168.1.20:3777/api/
    enable_write: true   # writes allowed here - but only while IPS_ENABLE_WRITE is also set
    user: ""
    password: ""
