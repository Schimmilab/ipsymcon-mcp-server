name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

      # Smoke-Test: startet den Server wirklich und spricht das MCP-Protokoll
      # (initialize -> tools/list). pytest beantwortet nicht, ob der Server
      # nach einer Frischinstallation ueberhaupt laeuft; ein Import-Test auch
      # nicht, weil Tools in Dekoratoren registriert werden.
      # Anlass: 30.07.2026 sechs Server aufs neue SDK umgestellt und gemerged,
      # am 31.07. waren fuenf tot - die CI hatte nichts gemerkt.
      - name: MCP-Smoke
        uses: Schimmilab/mcp-smoke-action@v1
        with:
          command: python -m ipsymcon_mcp
          min-tools: "20"
